name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS SDK & Import Libraries from Official OBS Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "1. Cloning OBS headers from official repo..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 --branch 33.0.1 https://github.com/obsproject/obs-studio.git $srcDir

          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          
          $configHeaderPath = Get-ChildItem -Path $srcDir -Filter "obsconfig.h" -Recurse | Select-Object -First 1
          if ($configHeaderPath) {
              Copy-Item -Path $configHeaderPath.FullName -Destination "$incDir\obsconfig.h" -Force
          } else {
              $obsConfigContent = "#pragma once`n#define OBS_VERSION `"33.0.1`"`n#define OBS_VERSION_MAJOR 33`n#define OBS_VERSION_MINOR 0`n#define OBS_VERSION_PATCH 1"
              Set-Content -Path "$incDir\obsconfig.h" -Value $obsConfigContent -Encoding Ascii
          }

          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($feHeader) {
              Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force
          }

          Write-Host "2. Generating complete export definitions for OBS import libs..."
          $defPath = "$env:RUNNER_TEMP\obs.def"
          $libPath = "$libDir\obs.lib"
          
          # Összegyűjtjük az összes hibásan hiányzó szimbólumot, hogy a linker azonnal megtalálja őket
          $symbols = @(
              "blog", "bmalloc", "bfree",
              "obs_data_create", "obs_data_release", "obs_data_set_string", "obs_data_set_int", "obs_data_set_bool", "obs_data_set_default_int",
              "obs_properties_create", "obs_properties_add_list", "obs_register_source_s",
              "obs_enter_graphics", "obs_leave_graphics",
              "obs_get_video_info", "obs_display_create", "obs_display_destroy", "obs_display_resize", 
              "obs_display_add_draw_callback", "obs_display_remove_draw_callback", "obs_source_video_render",
              "text_lookup_destroy", "text_lookup_getstr", "obs_module_load_locale",
              "obs_frontend_get_main_window", "obs_frontend_add_tools_menu_item",
              "obs_source_create_private", "obs_source_release", "obs_source_update", "obs_source_get_settings",
              "obs_source_inc_showing", "obs_source_dec_showing", "obs_source_media_play_pause",
              "obs_source_media_restart", "obs_source_media_get_duration", "obs_source_media_get_time",
              "obs_source_media_set_time", "obs_source_media_get_state"
          )

          $defContent = "LIBRARY obs`nEXPORTS`n"
          foreach ($sym in $symbols) {
              $defContent += "  $sym`n"
          }

          $defContent | Set-Content -Path $defPath -Encoding Ascii
          & lib /def:$defPath /out:$libPath /machine:x64
          Copy-Item -Path $libPath -Destination "$libDir\obs-frontend-api.lib" -Force

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
