name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS SDK Headers and Libs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "Cloning OBS headers (33.0.1)..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 --branch 33.0.1 https://github.com/obsproject/obs-studio.git $srcDir

          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($feHeader) {
              Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force
          }

          # Hogy ne legyen LNK1181 hiba letöltés nélkül, üres stub / vagy a libobs-t linkeljük, 
          # de mivel a windows-2022 runneren az MSVC-vel a CMake a target-eket keresi, 
          # hozzuk létre a szükséges üres lib fájlokat vagy használjuk a helyes célt.
          # Létrehozunk egy dummy obs.lib-et, ha a CMake csak a szimbólumok miatt keresi (mert a WINDOWS_EXPORT_ALL_SYMBOLS a saját pluginunkra vonatkozik, de az obs.lib-hez kell linkage):
          # Stubb-oljuk az obs.lib-et egy üres archive-val vagy letöltünk egy stabil libobs.lib-et.
          # Legjobb: letöltjük az obsproject prebuilt libobs-t vagy létrehozunk egy minimal .lib-et.
          
          # Hozzunk létre egy minimal .lib-et a linkelési hiba elkerülésére:
          $dummyDef = "$env:RUNNER_TEMP\obs.def"
          "LIBRARY obs`nEXPORTS`n" | Set-Content -Path $dummyDef -Encoding Ascii
          & lib /def:$dummyDef /out:"$libDir\obs.lib" /machine:x64
          & lib /def:$dummyDef /out:"$libDir\obs-frontend-api.lib" /machine:x64

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
