name: Build OBS VJ DJ Plugin (OBS 33.0.1)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.1'

    - name: Prepare OBS SDK (Headers + Libraries)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
        $sourceDir = "$env:RUNNER_TEMP\obs-source"
        $buildDir = "$env:RUNNER_TEMP\obs-build"
        $zipPath = "$env:RUNNER_TEMP\obs-studio.zip"
        $releaseDir = "$env:RUNNER_TEMP\obs-release"

        New-Item -ItemType Directory -Force -Path "$sdkDir\include\libobs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\include\obs-frontend-api" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\lib" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\bin" | Out-Null
        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

        Write-Host "Downloading OBS Studio 33.0.1 release ZIP..."
        Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip" -OutFile $zipPath
        Expand-Archive -Path $zipPath -DestinationPath $releaseDir -Force

        Write-Host "Cloning OBS Studio 33.0.1 source..."
        git clone --depth 1 --recurse-submodules --shallow-submodules --branch 33.0.1 https://github.com/obsproject/obs-studio.git $sourceDir
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to clone OBS Studio source and its submodules."
        }

        Write-Host "Configuring OBS Studio build..."
        cmake -S $sourceDir -B $buildDir -G "Visual Studio 17 2022" -A x64 `
          -DBUILD_BROWSER=OFF `
          -DBUILD_TESTS=OFF `
          -DENABLE_UI=OFF `
          -DCMAKE_BUILD_TYPE=Release

        Write-Host "Building OBS libs..."
        cmake --build $buildDir --config Release --target libobs obs-frontend-api

        Write-Host "Copying OBS headers..."
        if (Test-Path "$sourceDir\libobs") {
          Copy-Item -Recurse -Force "$sourceDir\libobs\*" "$sdkDir\include\libobs\"
        }

        if (Test-Path "$sourceDir\frontend\api") {
          Copy-Item -Recurse -Force "$sourceDir\frontend\api\*.h" "$sdkDir\include\obs-frontend-api\"
        } elseif (Test-Path "$sourceDir\UI\obs-frontend-api") {
          Copy-Item -Recurse -Force "$sourceDir\UI\obs-frontend-api\*.h" "$sdkDir\include\obs-frontend-api\"
        } else {
          throw "obs-frontend-api headers not found in OBS source."
        }

        Write-Host "Copying OBS import libraries..."
        $libobsLib = "$buildDir\libobs\Release\libobs.lib"
        $frontendLib = "$buildDir\UI\obs-frontend-api\Release\obs-frontend-api.lib"

        if (Test-Path $libobsLib) {
          Copy-Item -Force $libobsLib "$sdkDir\lib\libobs.lib"
          Copy-Item -Force $libobsLib "$sdkDir\bin\libobs.lib"
        } else {
          throw "libobs.lib was not found after building OBS."
        }

        if (Test-Path $frontendLib) {
          Copy-Item -Force $frontendLib "$sdkDir\lib\obs-frontend-api.lib"
          Copy-Item -Force $frontendLib "$sdkDir\bin\obs-frontend-api.lib"
        } else {
          Write-Warning "obs-frontend-api.lib not found at $frontendLib"
        }

        $obsConfigPath = "$sdkDir\include\libobs\obsconfig.h"
        @(
          "#pragma once",
          '#define OBS_VERSION "33.0.1"',
          '#define OBS_VERSION_NUMBER 0x210001'
        ) | Set-Content -Path $obsConfigPath -Encoding ascii

        Write-Host "OBS SDK preparation complete."

    - name: Configure CMake
      env:
        OBS_SDK_DIR: ${{ runner.temp }}/obs-sdk
      shell: pwsh
      run: |
        cmake -B build -A x64 -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

    - name: Build Plugin
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
