name: Build OBS VJ DJ Plugin (OBS 33.0.1)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.1'

    - name: Download and Extract OBS Studio 33.0.1 SDK
      shell: pwsh
      run: |
        $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip"
        $outputZip = "$env:RUNNER_TEMP\obs-sdk.zip"
        $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
        
        New-Item -ItemType Directory -Force -Path $sdkDir
        Write-Host "Downloading OBS Studio SDK from $sdkUrl..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $outputZip -MaximumRedirection 5
        
        Write-Host "Extracting OBS Studio SDK..."
        Expand-Archive -Path $outputZip -DestinationPath $sdkDir -Force

        # Ellenőrzésképpen kiírjuk, hol van a libobs.lib
        Get-ChildItem -Path $sdkDir -Recurse -Filter "libobs.lib" | Select-Object FullName

    - name: Configure CMake
      env:
        OBS_SDK_DIR: ${{ runner.temp }}/obs-sdk
      shell: pwsh
      run: |
        cmake -B build -A x64 -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

    - name: Build Plugin
      shell: pwsh
      run: |
        cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
