name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS SDK & Import Libraries from Official OBS Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "1. Cloning OBS headers from official repo..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 --branch 33.0.1 https://github.com/obsproject/obs-studio.git $srcDir

          # Copy libobs headers
          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          
          # Hozzáadjuk a hiányzó obsconfig.h fájlt a gyökérből/build mappából vagy generálunk egyet
          $configHeaderPath = Get-ChildItem -Path $srcDir -Filter "obsconfig.h" -Recurse | Select-Object -First 1
          if ($configHeaderPath) {
              Copy-Item -Path $configHeaderPath.FullName -Destination "$incDir\obsconfig.h" -Force
          } else {
              # Ha nincs generálva, létrehozunk egy minimalista obsconfig.h-t a hibák elkerülésére
              $obsConfigContent = @"
#pragma once
#define OBS_VERSION "33.0.1"
#define OBS_VERSION_MAJOR 33
#define OBS_VERSION_MINOR 0
#define OBS_VERSION_PATCH 1
"@
              $obsConfigContent | Set-Content -Path "$incDir\obsconfig.h" -Encoding Ascii
          }

          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($feHeader) {
              Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force
          }

          Write-Host "2. Creating stub import libraries to satisfy linker..."
          $dummyDef = "$env:RUNNER_TEMP\obs.def"
          "LIBRARY obs`nEXPORTS`n" | Set-Content -Path $dummyDef -Encoding Ascii
          & lib /def:$dummyDef /out:"$libDir\obs.lib" /machine:x64
          & lib /def:$dummyDef /out:"$libDir\obs-frontend-api.lib" /machine:x64

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
