name: Build OBS VJ DJ Plugin (OBS 33.0.1)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download and Extract OBS Studio 33.0.1 SDK Package
      run: |
        $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Windows-x64.zip"
        $outputZip = "$env:RUNNER_TEMP\\obs-sdk.zip"
        $sdkDir = "$env:RUNNER_TEMP\\obs-sdk"
        
        Write-Host "Downloading OBS Studio 33.0.1 from $sdkUrl..."
        try {
            Invoke-WebRequest -Uri $sdkUrl -OutFile $outputZip -MaximumRedirection 5
        } catch {
            Write-Warning "Direct download failed, trying git clone fallback for headers..."
            git clone --depth 1 --branch 33.0.1 https://github.com/obsproject/obs-studio.git C:/obs-source
            New-Item -ItemType Directory -Force -Path "$sdkDir\\include"
            Copy-Item -Recurse -Force "C:/obs-source/libobs" "$sdkDir\\include/"
            Copy-Item -Recurse -Force "C:/obs-source/UI/obs-frontend-api" "$sdkDir\\include/"
            exit 0
        }
        
        Write-Host "Extracting OBS Studio 33.0.1..."
        Expand-Archive -Path $outputZip -DestinationPath $sdkDir -Force
      shell: pwsh

    - name: Configure CMake
      env:
        OBS_SDK_DIR: ${{ runner.temp }}/obs-sdk
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DOBS_SDK_DIR="$env:OBS_SDK_DIR"
      shell: pwsh

    - name: Build Plugin
      run: |
        cmake --build build --config Release
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
