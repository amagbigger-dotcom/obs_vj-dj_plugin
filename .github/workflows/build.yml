name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS SDK & Import Libraries from Official OBS Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "1. Cloning OBS headers from official repo..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 --branch 30.2.3 https://github.com/obsproject/obs-studio.git $srcDir

          # Copy libobs, UI headers, and frontend-api
          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($feHeader) {
              Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force
          }

          Write-Host "2. Downloading official OBS release archive to extract DLLs and generate valid import libs..."
          $obsZip = "$env:RUNNER_TEMP\obs-portable.zip"
          Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Full-Windows.zip" -OutFile $obsZip
          $extractDir = "$env:RUNNER_TEMP\obs-extracted"
          Expand-Archive -Path $obsZip -DestinationPath $extractDir -Force

          # Find obs.dll and obs-frontend-api.dll in the extracted files
          $obsDll = Get-ChildItem -Path $extractDir -Filter "obs.dll" -Recurse | Select-Object -First 1
          $feDll = Get-ChildItem -Path $extractDir -Filter "obs-frontend-api.dll" -Recurse | Select-Object -First 1

          if (-not $obsDll) { throw "obs.dll not found in downloaded OBS release!" }

          Write-Host "Found obs.dll at: $($obsDll.FullName)"
          Write-Host "Found obs-frontend-api.dll at: $($feDll.FullName)"

          # Generate import library for obs.dll and obs-frontend-api.dll automatically using dumpbin and lib
          function Generate-ImportLib($dllPath, $libName, $outputLibDir) {
              $syms = & dumpbin /exports $dllPath | Select-String -Pattern "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)"
              $defPath = "$env:RUNNER_TEMP\$libName.def"
              $libOut = "$outputLibDir\$libName.lib"
              
              $defContent = "LIBRARY $libName`nEXPORTS`n"
              foreach ($line in $syms) {
                  if ($line.Matches.Groups[1].Value) {
                      $defContent += "  $($line.Matches.Groups[1].Value)`n"
                  }
              }
              $defContent | Set-Content -Path $defPath -Encoding Ascii
              & lib /def:$defPath /out:$libOut /machine:x64
              Write-Host "Successfully generated $libOut"
          }

          Generate-ImportLib $obsDll.FullName "obs" $libDir
          if ($feDll) {
              Generate-ImportLib $feDll.FullName "obs-frontend-api" $libDir
          }

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
