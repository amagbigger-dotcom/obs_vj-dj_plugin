name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS Studio SDK Headers and Import Libs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "1. Cloning OBS 30.2.3 source for headers..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 https://github.com/obsproject/obs-studio.git $srcDir
          git -C $srcDir fetch --depth 1 origin c45ba7415e65201d269132f112072d83c23fa88b 2>$null
          git -C $srcDir checkout c45ba7415e65201d269132f112072d83c23fa88b 2>$null

          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force

          Write-Host "2. Downloading OBS 30.2.3 Windows release zip for real DLLs..."
          $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Windows.zip"
          $zipPath = "$env:RUNNER_TEMP\obs-bin.zip"
          $binDir = "$env:RUNNER_TEMP\obs-bin"
          
          # Letöltés curl-lel, ha nem létezne vagy hibás
          & curl.exe -L --retry 3 -o $zipPath $sdkUrl
          Expand-Archive -Path $zipPath -DestinationPath $binDir -Force

          Write-Host "3. Generating real import libs from OBS DLLs..."
          function New-ObsImportLib($dllName, $libName) {
              $dllFile = Get-ChildItem -Path $binDir -Filter $dllName -Recurse | Select-Object -First 1
              if (-not $dllFile) { throw "Could not find $dllName" }
              $defPath = "$env:RUNNER_TEMP\$libName.def"
              $libPath = "$libDir\$libName.lib"
              $dump = & dumpbin /exports $dllFile.FullName
              $defLines = @("LIBRARY $($dllFile.BaseName)", "EXPORTS")
              foreach ($line in $dump) {
                  if ($line -match "^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([A-Za-z0-9_@?$]+)") {
                      $defLines += "    $($matches[1])"
                  }
              }
              $defLines | Set-Content -Path $defPath -Encoding Ascii
              & lib "/def:$defPath" "/out:$libPath" /machine:x64
          }

          New-ObsImportLib "obs.dll" "obs"
          New-ObsImportLib "obs-frontend-api.dll" "obs-frontend-api"

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
