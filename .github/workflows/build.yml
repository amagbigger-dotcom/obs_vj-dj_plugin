name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Prepare OBS SDK & Real Import Libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
          $incDir = "$sdkDir\include"
          $libDir = "$sdkDir\lib"
          New-Item -ItemType Directory -Path $incDir -Force | Out-Null
          New-Item -ItemType Directory -Path $libDir -Force | Out-Null

          Write-Host "1. Cloning OBS headers (33.0.1)..."
          $srcDir = "$env:RUNNER_TEMP\obs-src"
          if (Test-Path $srcDir) { Remove-Item -Path $srcDir -Recurse -Force }
          git clone --depth 1 --branch 33.0.1 https://github.com/obsproject/obs-studio.git $srcDir

          Copy-Item -Path "$srcDir\libobs\*" -Destination $incDir -Recurse -Force
          
          $configHeaderPath = Get-ChildItem -Path $srcDir -Filter "obsconfig.h" -Recurse | Select-Object -First 1
          if ($configHeaderPath) {
              Copy-Item -Path $configHeaderPath.FullName -Destination "$incDir\obsconfig.h" -Force
          } else {
              $obsConfigContent = "#pragma once`n#define OBS_VERSION `"33.0.1`"`n#define OBS_VERSION_MAJOR 33`n#define OBS_VERSION_MINOR 0`n#define OBS_VERSION_PATCH 1"
              Set-Content -Path "$incDir\obsconfig.h" -Value $obsConfigContent -Encoding Ascii
          }

          $feHeader = Get-ChildItem -Path $srcDir -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($feHeader) {
              Copy-Item -Path $feHeader.FullName -Destination "$incDir\obs-frontend-api.h" -Force
          }

          Write-Host "2. Downloading official OBS release to generate real import libraries..."
          $obsZip = "$env:RUNNER_TEMP\obs-release.zip"
          # Letöltjük a hivatalos OBS 33.0.1 zip csomagot (vagy a legközelebbi stabil Windows zip-et)
          try {
              Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/33.0.1/OBS-Studio-33.0.1-Full-Windows.zip" -OutFile $obsZip
          } catch {
              # Fallback ha a zip neve eltér
              Invoke-WebRequest -Uri "https://github.com/obsproject/obs-studio/releases/download/30.2.3/OBS-Studio-30.2.3-Full-Windows.zip" -OutFile $obsZip
          }
          
          $extractDir = "$env:RUNNER_TEMP\obs-extracted"
          Expand-Archive -Path $obsZip -DestinationPath $extractDir -Force

          $obsDll = Get-ChildItem -Path $extractDir -Filter "obs.dll" -Recurse | Select-Object -First 1
          $feDll = Get-ChildItem -Path $extractDir -Filter "obs-frontend-api.dll" -Recurse | Select-Object -First 1

          function Create-LibFromDll($dllPath, $libName) {
              if (-not $dllPath) { return }
              $defPath = "$env:RUNNER_TEMP\$libName.def"
              $libOut = "$libDir\$libName.lib"
              
              $syms = & dumpbin /exports $dllPath.FullName | Select-String -Pattern "^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)"
              $defContent = "LIBRARY $libName`nEXPORTS`n"
              foreach ($line in $syms) {
                  if ($line.Matches.Groups[1].Value) {
                      $defContent += "  $($line.Matches.Groups[1].Value)`n"
                  }
              }
              $defContent | Set-Content -Path $defPath -Encoding Ascii
              & lib /def:$defPath /out:$libOut /machine:x64
              Write-Host "Generated $libOut successfully."
          }

          if ($obsDll) { Create-LibFromDll $obsDll "obs" }
          if ($feDll) { Create-LibFromDll $feDll "obs-frontend-api" } else { Copy-Item -Path "$libDir\obs.lib" -Destination "$libDir\obs-frontend-api.lib" -Force }

          "OBS_SDK_DIR=$sdkDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
