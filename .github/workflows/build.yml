name: Build OBS VJ DJ Plugin (OBS 33.0.1)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.1'

    - name: Prepare OBS SDK (Headers + Libraries)
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
        $sourceDir = "$env:RUNNER_TEMP\obs-source"
        $buildDir = "$env:RUNNER_TEMP\obs-build"

        New-Item -ItemType Directory -Force -Path "$sdkDir\include\libobs" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\include\obs-frontend-api" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\lib" | Out-Null
        New-Item -ItemType Directory -Force -Path "$sdkDir\bin" | Out-Null

        Write-Host "Cloning OBS Studio 33.0.1 with submodules..."
        git clone --depth 1 --recurse-submodules --shallow-submodules --branch 33.0.1 https://github.com/obsproject/obs-studio.git $sourceDir
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to clone OBS Studio source and its submodules."
        }

        Write-Host "Configuring OBS Studio..."
        cmake -S $sourceDir -B $buildDir -G "Visual Studio 17 2022" -A x64 `
          -DBUILD_BROWSER=OFF `
          -DBUILD_TESTS=OFF `
          -DENABLE_FRONTEND=OFF `
          -DENABLE_SCRIPTING=OFF `
          -DCMAKE_BUILD_TYPE=Release
        if ($LASTEXITCODE -ne 0) {
          throw "OBS Studio CMake configuration failed."
        }

        Write-Host "Building OBS libraries..."
        cmake --build $buildDir --config Release --target libobs obs-frontend-api --parallel
        if ($LASTEXITCODE -ne 0) {
          throw "OBS library build failed."
        }

        Write-Host "Copying OBS headers..."
        Copy-Item -Recurse -Force "$sourceDir\libobs\*" "$sdkDir\include\libobs\"
        Copy-Item -Force "$buildDir\config\obsconfig.h" "$sdkDir\include\libobs\obsconfig.h"
        Copy-Item -Force "$sourceDir\frontend\api\*.h" "$sdkDir\include\obs-frontend-api\"

        Write-Host "Searching for generated OBS import libraries..."
        Get-ChildItem -Path $buildDir -Recurse -File -Include "obs.lib", "obs-frontend-api.lib" |
          ForEach-Object { Write-Host $_.FullName }

        # OBS 33 names the libobs Windows import library obs.lib.
        $libobsLib = Get-ChildItem -Path $buildDir -Recurse -File -Filter "obs.lib" |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $libobsLib) {
          throw "obs.lib was not found after building OBS. See the library search output above."
        }

        # The plugin's CMakeLists links against libobs, so place it under that filename.
        Copy-Item -Force $libobsLib "$sdkDir\lib\libobs.lib"
        Copy-Item -Force $libobsLib "$sdkDir\bin\libobs.lib"

        $frontendLib = Get-ChildItem -Path $buildDir -Recurse -File -Filter "obs-frontend-api.lib" |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $frontendLib) {
          throw "obs-frontend-api.lib was not found after building OBS."
        }

        Copy-Item -Force $frontendLib "$sdkDir\lib\obs-frontend-api.lib"
        Copy-Item -Force $frontendLib "$sdkDir\bin\obs-frontend-api.lib"

        Write-Host "OBS SDK preparation complete."

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -A x64 -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"
        if ($LASTEXITCODE -ne 0) {
          throw "Plugin CMake configuration failed."
        }

    - name: Build Plugin
      shell: pwsh
      run: |
        cmake --build build --config Release
        if ($LASTEXITCODE -ne 0) {
          throw "Plugin build failed."
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
