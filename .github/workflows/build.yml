name: Build OBS VJ DJ Plugin (OBS 33.0.1)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.1'

    - name: Prepare OBS SDK Headers and Libs
      run: |
        $sdkDir = "$env:RUNNER_TEMP\\obs-sdk"
        New-Item -ItemType Directory -Force -Path "$sdkDir\\include\\libobs"
        New-Item -ItemType Directory -Force -Path "$sdkDir\\include\\obs-frontend-api"
        New-Item -ItemType Directory -Force -Path "$sdkDir\\lib"
        
        Write-Host "Cloning OBS Studio source for headers..."
        git clone --depth 1 https://github.com/obsproject/obs-studio.git C:/obs-source
        
        if (Test-Path "C:/obs-source/libobs") {
            Copy-Item -Recurse -Force "C:/obs-source/libobs/*" "$sdkDir\\include\\libobs/"
        }
        if (Test-Path "C:/obs-source/UI/obs-frontend-api") {
            Copy-Item -Recurse -Force "C:/obs-source/UI/obs-frontend-api/*" "$sdkDir\\include\\obs-frontend-api/"
        } elseif (Test-Path "C:/obs-source/obs-frontend-api") {
            Copy-Item -Recurse -Force "C:/obs-source/obs-frontend-api/*" "$sdkDir\\include\\obs-frontend-api/"
        }
      shell: pwsh

    - name: Configure CMake
      env:
        OBS_SDK_DIR: ${{ runner.temp }}/obs-sdk
      run: |
        cmake -B build -A x64 -DOBS_SDK_DIR="$env:RUNNER_TEMP/obs-sdk"
      shell: pwsh

    - name: Build Plugin
      run: |
        cmake --build build --config Release
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
