name: Build OBS VJ DJ Plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download and Extract OBS SDK
      run: |
        $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/30.0.0/obs-studio-30.0.0-windows-x64.zip"
        $outputZip = "$env:RUNNER_TEMP\obs-sdk.zip"
        $sdkDir = "$env:RUNNER_TEMP\obs-sdk"
        
        Write-Host "Downloading OBS SDK..."
        Invoke-WebRequest -Uri $sdkUrl -OutFile $outputZip
        
        Write-Host "Extracting OBS SDK..."
        Expand-Archive -Path $outputZip -DestinationPath $sdkDir -Force
        
        # Ellenőrzés, hogy a lib és include mappa ott van-e
        Get-ChildItem $sdkDir
      shell: pwsh

    - name: Configure CMake
      env:
        OBS_SDK_DIR: ${{ runner.temp }}/obs-sdk
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DOBS_SDK_DIR="$env:OBS_SDK_DIR"
      shell: pwsh

    - name: Build Plugin
      run: |
        cmake --build build --config Release
      shell: pwsh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: obs_vj-dj_plugin.dll
        path: build/Release/obs_vj-dj_plugin.dll
