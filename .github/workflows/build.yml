name: Build OBS VJ Mixer Plugin (Windows x64)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      - name: Download & Extract OBS Studio SDK
        shell: pwsh
        run: |
          $sdkUrl = "https://github.com/obsproject/obs-studio/releases/download/30.2.3/obs-studio-30.2.3-Windows.zip"
          $zipPath = "$env:RUNNER_TEMP\obs-sdk.zip"
          $extractPath = "$env:RUNNER_TEMP\obs-sdk"
          
          Write-Host "Downloading OBS SDK from $sdkUrl..."
          Invoke-WebRequest -Uri $sdkUrl -OutFile $zipPath
          
          Write-Host "Extracting OBS SDK..."
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          
          # Fejlécek pontos helyének ellenőrzése
          $header = Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($header) {
              $sdkRoot = $header.Directory.Parent.FullName
              Write-Host "Found OBS headers in: $($header.Directory.FullName)"
          } else {
              $sdkRoot = $extractPath
          }
          
          "OBS_SDK_DIR=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "OBS SDK set to: $sdkRoot"

      - name: Configure CMake
        shell: pwsh
        run: |
          $sdkRoot = "$env:RUNNER_TEMP\obs-sdk"
          $header = Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "obs-frontend-api.h" -Recurse | Select-Object -First 1
          if ($header) {
              $sdkRoot = $header.Directory.Parent.FullName
          }
          
          $env:OBS_SDK_DIR = $sdkRoot
          
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" `
            -DOBS_SDK_DIR="$sdkRoot"

      - name: Build Plugin
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path bin -Force
          Get-ChildItem -Path build -Recurse -Filter "obs-vj-mixer.dll" | Copy-Item -Destination bin/
          Get-Item bin\obs-vj-mixer.dll

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-vj-mixer-windows-x64
          path: bin/obs-vj-mixer.dll
          if-no-files-found: error
